name: Release - Docker Hub

on:
  push:
    branches:
      - main

jobs:
  tag:
    name: Generar versión semántica
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.new_tag }}

    permissions:
      contents: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version y crear tag
        id: bump
        uses: anothrNick/github-tag-action@1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: false
          TAG_CONTEXT: repo

  build:
    name: Build Docker image
    needs: tag
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ needs.tag.outputs.version }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Generar metadata de build
        id: metadata
        run: echo "build-date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"

      - name: Construir imagen
        run: |
          docker build \
            --build-arg APP_VERSION=${{ needs.tag.outputs.version }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=${{ steps.metadata.outputs.build-date }} \
            -t devops-tp-api:${{ needs.tag.outputs.version }} \
            -t devops-tp-api:latest \
            .

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-tp-api:${{ needs.tag.outputs.version }}
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Levantar API para escaneo dinámico
        run: |
          docker network create zap-net
          docker run -d \
            --name devops-tp-api \
            --network zap-net \
            -e ASPNETCORE_ENVIRONMENT=Production \
            devops-tp-api:${{ needs.tag.outputs.version }}

          for i in {1..30}; do
            if docker run --rm --network zap-net curlimages/curl:8.8.0 -fsS http://devops-tp-api:8080/health; then
              exit 0
            fi

            sleep 2
          done

          docker logs devops-tp-api
          exit 1

      - name: Escanear API con OWASP ZAP
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm \
            --network zap-net \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
            -t http://devops-tp-api:8080/swagger/v1/swagger.json \
            -f openapi \
            -r zap-report.html \
            -J zap-report.json \
            -w zap-report.md \
            -I

      - name: Subir reporte ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-reports/
          retention-days: 7

      - name: Detener API de escaneo
        if: always()
        run: |
          docker rm -f devops-tp-api || true
          docker network rm zap-net || true

      - name: Guardar imagen como artefacto
        run: docker save devops-tp-api:${{ needs.tag.outputs.version }} devops-tp-api:latest | gzip > /tmp/docker-image.tar.gz

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/docker-image.tar.gz
          retention-days: 1

  push-to-dockerhub:
    name: Push a Docker Hub
    needs: [tag, build]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Descargar imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Cargar imagen en Docker
        run: docker load < /tmp/docker-image.tar.gz

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push imagen
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/devops-tp-api"
          TAG="${{ needs.tag.outputs.version }}"

          docker tag devops-tp-api:$TAG $IMAGE:$TAG
          docker tag devops-tp-api:latest $IMAGE:latest

          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

          echo "Imagen publicada: $IMAGE:$TAG"

      - name: Trigger deploy en Render con imagen versionada
        run: |
          TAG="${{ needs.tag.outputs.version }}"
          IMAGE="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/devops-tp-api:${TAG}"
          HOOK="${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

          if [[ "$HOOK" == *"?"* ]]; then
            DEPLOY_URL="${HOOK}&imgURL=${IMAGE}"
          else
            DEPLOY_URL="${HOOK}?imgURL=${IMAGE}"
          fi

          curl -s --fail -X POST "$DEPLOY_URL"

          echo "Deploy disparado en Render con imagen: $IMAGE"
